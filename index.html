<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>我的論壇</title>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f5f5f5;
    }

    header {
      background: #6c63ff;
      color: white;
      padding: 25px;
      text-align: center;
    }

    .container {
      max-width: 800px;
      margin: 30px auto;
      padding: 0 15px;
    }

    .category {
      background: white;
      padding: 20px;
      margin-bottom: 15px;
      border-radius: 12px;
      box-shadow: 0 2px 8px #ddd;
    }

    .category h2 {
      margin-top: 0;
    }

    .category p {
      color: #666;
    }
  </style>
</head>

<body>

  <header>
    <h1>🌟 我的論壇</h1>
    <p>歡迎來到我的小論壇！</p>
  </header>

  <div class="container">

    <div class="category">
      <h2>💬 聊天區</h2>
      <p>大家可以在這裡聊天、交流。</p>
    </div>

    <div class="category">
      <h2>🎮 遊戲區</h2>
      <p>分享遊戲心得和有趣的事情。</p>
    </div>

    <div class="category">
      <h2>🎨 繪圖區</h2>
      <p>分享自己的作品。</p>
    </div>

    <div class="category">
      <h2>📢 公告區</h2>
      <p>論壇的重要公告會放在這裡。</p>
    </div>

  </div>

</body>
</html>
